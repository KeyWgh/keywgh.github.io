      "story-2020-03-20-how-to-fit-an-elephant-html": {
        "title": "How to fit an elephant",
        "date": "March 20th, 2020",
        "excerpt": "Cited from John D. Cook",
        "author": "",
        "category": "",
        "content": "Cited from John D. Cook  John von Neumann famously said      With four parameters I can fit an elephant, and with five I can make him wiggle his trunk.    By this he meant that one should not be impressed when a complex model fits a data set well. With enough parameters, you can fit any data set.It turns out you can literally fit an elephant with four parameters if you allow the parameters to be complex numbers. See this paper for details: “Drawing an elephant with four complex parameters”1.  Piotr also sent me the following Python code he’d written to implement the method in the paper. This code produced the image above.  \"\"\"Author: Piotr A. Zolnierczuk (zolnierczukp at ornl dot gov)Based on a paper by:Drawing an elephant with four complex parametersJurgen Mayer, Khaled Khairy, and Jonathon Howard,Am. J. Phys. 78, 648 (2010), DOI:10.1119/1.3254017\"\"\"import numpy as npimport pylab# elephant parametersp1, p2, p3, p4 = (50 - 30j, 18 +  8j, 12 - 10j, -14 - 60j )p5 = 40 + 20j # eyepiecedef fourier(t, C):    f = np.zeros(t.shape)    A, B = C.real, C.imag    for k in range(len(C)):        f = f + A[k]*np.cos(k*t) + B[k]*np.sin(k*t)    return fdef elephant(t, p1, p2, p3, p4, p5):    npar = 6    Cx = np.zeros((npar,), dtype='complex')    Cy = np.zeros((npar,), dtype='complex')    Cx[1] = p1.real*1j    Cx[2] = p2.real*1j    Cx[3] = p3.real    Cx[5] = p4.real    Cy[1] = p4.imag + p1.imag*1j    Cy[2] = p2.imag*1j    Cy[3] = p3.imag*1j    x = np.append(fourier(t,Cx), [-p5.imag])    y = np.append(fourier(t,Cy), [p5.imag])    return x,yx, y = elephant(np.linspace(0,2*np.pi,1000), p1, p2, p3, p4, p5)pylab.plot(y,-x,'.')pylab.show()  Some personal comments:  Actually we use 10 parameters to fit the whole elephant, and we need 12 to make its trunk wiggle.  The original paper requires access to read. Here is an alternative version.  Fourier strikes again!  The original speak can be found here.            Mayer, Jürgen, Khaled Khairy, and Jonathon Howard. “Drawing an elephant with four complex parameters.” American Journal of Physics 78.6 (2010): 648-649. &#8617;      ",
        "url": "/story/2020/03/20/How-to-fit-an-elephant.html"
      }

        "content": "Some questions met when constructing website, along with solution.ImagesRotation caused by EXIF info contained in metadata.To fix it we can use python:from PIL import Imageimage_file = \"\"im = Image.open(image_file)im.transpose(Image.ROTATE_270).save(image_file)  # Change 270 to any degree you wantTo see the details of EXIF:from PIL.ExifTags import TAGSfor tag, value in im._getexif().items():\t\tprint(f\"{:20s} {value})\")AlignmentFor multiple figures, the best way is to create a customized div by html. Control figure size by img tag.&lt;div id=\"row\"&gt;&lt;div class=\"column\"&gt;&lt;figure &gt;&lt;img  src=\"\"  width=\"200px\"&gt;&lt;figcaption style=\"text-align: left;\" &gt; Left &lt;/figcaption&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=\"column\" &gt;&lt;figure &gt;&lt;img  src=\"\"  width=\"200px\" &gt;&lt;figcaption style=\"text-align: left\"&gt; Right &lt;/figcaption&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;For parallel figure and text, using kramdown syntax:![](..){:  width=\"300px\" style=\"float: left; margin-right:5%\"} Some text float to the right.",
        "url": "/tools/2019/11/16/Jekyll-related.html"

      "seminar-2019-11-07-applying-principles-of-statistical-design-to-adaptive-probabilistic-differential-equation-solvers-html": {
        "title": "Applying Principles of Statistical Design to Adaptive Probabilistic Differential Equation Solvers",
        "date": "November 7th, 2019",
        "excerpt": "Speaker:   Oksana Chkrebtii, Department of Statistics, The Ohio State University",
        "author": "",
        "category": "",
        "content": "Speaker:   Oksana Chkrebtii, Department of Statistics, The Ohio State UniversityAbstract:When models are defined implicitly by systems of differential equations with no closed-form solution, small local errors in finite-dimensional solution approximations can propagate into deviations from the true underlying model. Some recent perspectives in quantifying this uncertainty are based on Bayesian probability modeling: a prior is defined over the unknown solution and updated by conditioning on interrogations of the forward model. We apply principles of Bayesian statistical design to sequentially adapt time-steps for state-space probabilistic differential equation solvers and investigate the behaviour of local error under the adaptive scheme which underlies numerical variable step-size methods.BackgroundDynamical system, inference on the variables of system states which are defined implicitly.D is a linear operator.  $x$ is spatial-temporal location. Approximation of solution will introduce structured uncertainty into the inverse problem.We want to estiamte unknown parameters $\\theta$, while we only observe Use $\\hat{u}$ to approximate true u.Goal and motivation: Characterize the uncertainty in this approximation to enable exact inference on $\\theta$.Tool: Using a Bayesian paradigm to PDE/ODE. Instead update the belief on $\\theta$, we try to update our belief on $u$!Example?Method:Several competeing methods:      Gaussian Process Prior on $(Du, u)^T$        Stepwise sampling and interrogate  ",
        "url": "/seminar/2019/11/07/Applying-Principles-of-Statistical-Design-to-Adaptive-Probabilistic-Differential-Equation-Solvers.html"
      }
      ,
    
    
    
    
    
      "seminar-2019-10-24-log-normal-hierarchical-modeling-and-prior-influence-for-astronomical-instrument-calibration-html": {
        "title": "Log-Normal Hierarchical Modeling and Prior Influence for Astronomical Instrument Calibration",
        "date": "October 24th, 2019",
        "excerpt": "Speaker:  Yang Chen, (Department of Statistics &amp; MIDAS, University of Michigan)",
        "author": "",
        "category": "",
        "content": "Speaker:  Yang Chen, (Department of Statistics &amp; MIDAS, University of Michigan)BackgroundRelationship between flux, effective area and measurements. Want to know the property of astronomical object, like flux. Measurements depend on effective area, which differs for each instrument, also changes by time.Problem: The data from different instruments don’t agree, due to a lot of reasons. How to fix?Goal: Know the effecitve area of each instruments to fix.Assume true effective area is $A_i$(unknown), and estimated $a_i$(known). Flux for each source $F_j$ (unkown). Photon counts $c_{ij}$ (observations)Counts = ExposureTime * Effective Area * FLux, set time to 1.Model: loglinear model with normal error term.$y_{ij}=log{c_{ij}}-\\alpha_{ij}=B_i+G_i+e_{ij}, B_i=log A_i, G_i = logF_i, e_{ij}\\sim N(0, \\sigma^2_{ij})$$\\alpha_{ij}=\\frac{\\sigma_{ij}^2}{2}$ , ==Half variance correction.==Method: Bayesian hierarchical modelPiror $B_i \\sim N(b_i, \\tau_i^2), G_i \\sim flat \\ prior, \\sigma \\sim Inv-Gamma$==Sensitive to prior!== Where experts experience come in for choose prior.Investigate on condition number of variance of sigma, a big noise on B_i will make converge harder(worse posterior). (hurt identifiability)Using HMC to sampling.Advantages using Bayesian way:Narrow confidence interval (small variance) can cause false discvoeries if it’s not reliable.Tolerance of model/error misspecification.Extension:In order to compatible with Poisson assumption, extend normal to t distribution will give a better results for low Poisson parameter.",
        "url": "/seminar/2019/10/24/Log-Normal-Hierarchical-Modeling-and-Prior-Influence-for-Astronomical-Instrument-Calibration.html"
      }

      "tools-2019-10-11-latex-related-html": {
        "title": "Latex related topics",
        "date": "October 11th, 2019",
        "excerpt": "A learning note for latex.",
        "author": "",
        "category": "",
        "content": "A learning note for latex.For symbols      Quick reference        Using Roman    \\makeatletter\\newcommand*{\\rom}[1]{\\expandafter\\@slowromancap\\romannumeral #1@}\\makeatother        \\romannumeral is $\\LaTeX$  kernel primitive    Alternatively, using packages like \\usepackage{romannum}        Put word/symbol above a symnol    \\overset{}        For arrows \\xRightarrow[below]{above}        Accents, Special letters    Accents    Link to TeX overflow: Here.    OS based method, directly type accents: Here. For Macintosh, option+e+LETTER.  Figures and Tables      Mixed Alignment                  floatrow Based Solution        \\begin{figure}\t\\CenterFloatBoxes\t\\begin{floatrow}\t\t\\ffigbox[\\FBwidth]\t\t{\\cpation{figure caption goes here}\\label{fig: figure-label}}\t\t{figure puts here}\t\t\\killfloatstyle\\ttabbox[\\Xhsize]\t\t{\\caption{table caption goes  here}\\label{tab: table-label}}\t\t{table puts here}\t\\end{floatrow}\\end{figure}                          In two column environment, \\begin{figure}...\\end{figure} should be replaced by \\begin{figure*}...\\begin{figure*} if you want your mixed results occupy both of the columns.          If you have used float package, you can not use this solution. Because they are incompitable.                            minipage Based Solution        After each mintage, use \\captionsetup{type=...} to change float type.            ",
        "url": "/tools/2019/10/11/Latex-related.html"

      "seminar-2019-09-19-maximum-likelihood-theory-for-high-dimensional-logistic-regression-html": {
        "title": "Modern Maximum-Likelihood Theory for High-Dimensional Logistic Regression",
        "date": "September 19th, 2019",
        "excerpt": "Speaker: Pragya Sur (Harvard University)",
        "author": "",
        "category": "",
        "content": "Speaker: Pragya Sur (Harvard University)BackgroundLogistic regression model, mainly for binary data.$\\mathbb{P}(y=1 \\vert X)=\\frac{e^{b^TX}}{1+e^{b^TX}}$Classic MLE results, for fixed p, we have $\\sqrt{n}(\\hat{\\beta}-\\beta)\\to N(0, I^{-1})$​\t hypothesis testing, Wilks theorem.how about diverging p? Some references.Data:Inspiration: 100~1000 sample size, 10~100 features. p close to n. When n/p is 5~10, can we trust results?Obeservation: MLE will have systematic shift on both magnitudes and variance. Wilks theorem failed as well.When finite sample, do correction. Like LRT first order correction. $\\mathbb{E}(-2 lnLRT) \\sim 1+\\frac{\\alpha}{n}+O(1/n^2)$, which not enough for high dimension.High dimensional behavior($p, n \\to \\infty, p/n \\text{ to a constant } \\kappa$).$\\hat{\\beta}-\\alpha\\beta\\to N(0, \\sigma^2_{h.d})$, which has a larger variance than classical result.$-2lnLRT \\sim r\\chi^2, r&gt;1$Some assumptions, like Signal strength $\\gamma$ should be strong enough(converge to a constant), $\\sqrt{n}X_i \\sim N(0, I)$ .When $\\kappa$ is large, MLE may doesn’t exist. Associated with $\\kappa, \\gamma$, soltuion could be characterized as $\\alpha, \\sigma, \\lambda$, which decide the final behavior.Results:Given the asymptotical behaive for mle estimators and LRT in this case.Interpretation of $\\lambda$, $r$ can be represented by $\\sigma, \\lambda$, and $\\lambda$ captures the trace of Hessian matrix for estimation in high dimension.Some Tools:robust M-estimationLeave-one-out argument for \\beta distributionExtension to penalty estimatorDistribution follows the proximal of penalty function with proper parameters.",
        "url": "/seminar/2019/09/19/Maximum-Likelihood-Theory-for-High-Dimensional-Logistic-Regression.html"
      }
