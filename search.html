        "author": "",

        "content": "In this notebook, we explore some popular matrix-decomposition based recommeder system algorithms on Movielens100K dataset. This is largely based on the slides of STAT8056, Spring 2021, which is taught by Prof. Xiaotong Shen.                    Table of Contents1&nbsp;&nbsp;Introduction1.1&nbsp;&nbsp;Enviornments &amp; requirements2&nbsp;&nbsp;Read data and an overview3&nbsp;&nbsp;Methods3.1&nbsp;&nbsp;Grand mean3.2&nbsp;&nbsp;Linear regression3.3&nbsp;&nbsp;SVD3.4&nbsp;&nbsp;Group SVD3.5&nbsp;&nbsp;Summary4&nbsp;&nbsp;ReferencesIntroduction&#182;Movielens data are comprised of movie ratings and are available athttp://grouplens.org/datasets/movielens/. The dataset was collected through the MovieLens web site(movielens.umn.edu) during the seven months from September 19th, 1997 through April 22nd, 1998. Thisdataset has been cleaned up - users who had less than 20 ratings or did not have complete demographicinformation were removed from this data set. Detailed descriptions of the data file are available at theend of README.txt on the website. The 100K MovieLens data consists of 1,000,000 anonymous ratingson a five-star scale from 1,000 users on 1,700 movies. Here are four categorical and one continuouscovariate, including four user-related covariates, gender, age, occupation, and zip-code, as well as onecontent-related covariate, genres. For simplicity, we treat gender, age, and occupation as continuousvariables, in addition to 19 different movie genres that are reparametrized into 19 binary covariates on ifa movie belongs to a particular genre, where only the first digit is used for the zip-code.Our goals:Predict the preference scores of each user on all movies using your favorite method such as deeplearning. Then compare your approach with the SVD approach. There are five pairs of trainingand testing data sets for, denoted by (u1.base,u1.test),· · ·,(u5.base,u5.test) there. It is natural touse five-fold cross-validation for training and testing. Compute the root mean square error basedon cross-validation.For this dataset, many ratings are not observed or missing. Do you have any evidence to suggestthat missing does not occur at random? (Hint: Supply suitable plots to argue.) If the goal isto build a recommender system with high accuracy of prediction to outperform the conventionalsingular value decomposition method, then demonstrate that incorporating the missing pattern canimprove the prediction performance.Enviornments &amp; requirements&#182;In&nbsp;[20]:     from sys import versionfrom importlib.metadata import version as vsrequirements = [&#39;numpy&#39;, &#39;pandas&#39;, &#39;seaborn&#39;, &#39;matplotlib&#39;, &#39;statsmodels&#39;, &#39;jupyter&#39;, &#39;scikit-surprise&#39;]print(&#39;\\n&#39;.join([f&#39;Python version: {version}&#39;]+[f&#39;{package.capitalize()} ~= {vs(package)}&#39; for package in requirements]))             Python version: 3.8.5 (default, Jan 27 2021, 15:41:15) [GCC 9.3.0]Numpy ~= 1.20.1Pandas ~= 1.2.3Seaborn ~= 0.11.1Matplotlib ~= 3.3.4Statsmodels ~= 0.12.2Jupyter ~= 1.0.0Scikit-surprise ~= 1.1.1Read data and an overview&#182;In&nbsp;[1]:     import osimport numpy as npimport pandas as pdimport seaborn as snsimport matplotlib.pyplot as pltimport seaborn as sns%matplotlib inline     In&nbsp;[2]:     markers = [&#39;s&#39;, &#39;.&#39;, &#39;^&#39;, &#39;*&#39;, &#39;+&#39;, &#39;*&#39;]line_types = [&#39;-.&#39;, &#39;-&#39;, &#39;:&#39;, &#39;-&#39;, &#39;--&#39;, &#39;--&#39;]SMALL_SIZE = 12MEDIUM_SIZE = 15BIGGER_SIZE = 20plt.rc(&#39;font&#39;, size=BIGGER_SIZE)  # controls default text sizesplt.rc(&#39;axes&#39;, titlesize=BIGGER_SIZE)  # fontsize of the axes titleplt.rc(&#39;axes&#39;, labelsize=BIGGER_SIZE)  # fontsize of the x and y labelsplt.rc(&#39;xtick&#39;, labelsize=BIGGER_SIZE)  # fontsize of the tick labelsplt.rc(&#39;ytick&#39;, labelsize=BIGGER_SIZE)  # fontsize of the tick labelsplt.rc(&#39;legend&#39;, fontsize=MEDIUM_SIZE)  # legend fontsizeplt.rc(&#39;fig #39;User\\&#39;s Averange rating&#39;)plt.subplot(122)sns.regplot(x=item_num_rating, y=item_ave_rating, lowess=True, line_kws={&#39;color&#39;:&#39;r&#39;})plt.xlabel(&#39;Number of item\\&#39;s ratings&#39;)plt.ylabel(&#39;Item\\&#39;s Averange rating&#39;)             Out[7]:Text(0, 0.5, &#34;Item&#39;s Averange rating&#34;)        The average ratings of different genres are similar to each other, except \"unknown\" category.In&nbsp;[8]:     item_sum_rating = ratings.sum(axis=0).to_numpy()genre_ave_rating = [item_sum_rating[genre.iloc[:,i] == 1].sum()/item_num_rating[genre.iloc[:,i] == 1].sum() for i in range(19)]sns.barplot(x=genre_ave_rating, y=genre_name)plt.yticks(fontsize=12);             Methods&#182;In this section, we try several popular algorithms which don't consider user/content covariates and the nonigonrable missing pattern. They areGrand mean imputation, used as baseline.Model: $\\hat{r}_{ui} = \\mu$.Simple linear regression, used as baseline.Model: $\\hat{r}_{ui} = \\mu + b_{u}+ b_{i}$.Optimization: minimize sum of square error(SSE) by alternating least square (ALS) or stochastic gradient descent (SGD) method.Regularized sigular value decomposition (rSVD) with means (Funk, 2006; Koren, 2009).Model: $\\hat{r}_{u i}=\\mu+b_{u}+b_{i}+ p_{u}^Tq_i$.Optimization: minimize $\\sum_{r_{u i} \\in R_{\\text {train }}}\\left(r_{u i}-\\hat{\\boldsymbol{r}}_{u i}\\right)^{2}+\\lambda\\left(b_{i}^{2}+b_{u}^{2}+\\left\\|q_{i}\\right\\|^{2}_2+\\left\\|p_{u}\\right\\|^{2}_2\\right)$, using ALS or SGD.*Regularized sigular value decomposition (SoftImpute) (Mazumder, 2010).Model: $\\hat{r}_{u i}= p_{u}^Tq_i$.Optimization: minimize a nuclear-norm regularized relaxtion to $\\ell_0$ regularized SSE $\\lVert R - \\Theta \\rVert_F^2 + \\lambda \\lVert \\Theta \\rVert_*$, where $\\Theta = P^TQ$. Use SoftImpute algorithm.*Regression-Based Latent FactorModels (Agarwal, 2009). Extension to 2, replacing the bias term of user and item by regression on covariates.Model: $\\hat{r}_{u i}=\\mu+b_{u}+b_{i}+ p_{u}^Tq_i$, $b_u \\sim N(x_u^T\\alpha, \\sigma^2)$, $b_i \\sim N(y_i^T\\beta, \\sigma^2)$.Optimization: use Bayesian way.*Partial Latent Models (Zhu, 2015). Extension to 2, replacing the bias term of user and item by regression on covariates.Model: $\\hat{r}_{u i}=x_u^T\\alpha+y_i^T\\beta+ p_{u}^Tq_i$.Optimization: use blockwise coordinate descent.Group specific latent model (Bi, 2017). Extension to 2, add a group mean to either user or item latent factor.Model: $\\Theta = (P+S_c)^T(Q+T_c)$, where $S_c, T_c$ is the group specific mean for each user/item.Optimization: blockwise coordinate descent.*Smooth neighborhood recommender system (Dai, 2020).Model: minimize $\\frac{1}{n m} \\sum_{u=1}^{n} \\sum_{i=1}^{m}\\left(\\sum_{\\left(u^{\\prime}, i^{\\prime}\\right) \\in \\Omega} \\omega_{u i, u^{\\prime} i^{\\prime}} r_{u^{\\prime} i^{\\prime}}-\\boldsymbol{p}_{u}^{T} \\boldsymbol{q}_{i}\\right)^{2}+\\lambda_{1} \\sum_{u=1}^{n} J\\left(\\boldsymbol{p}_{u}\\right)+\\lambda_{2} \\sum_{i=1}^{m} J\\left(\\boldsymbol{q}_{i}\\right)$.Optimization: ALS.Method start with * is not implemented below. Here only method 8 is knn based, all others are matrix-decomposition based.The data is split into five folds, and an average root mean square error(RMSE) is used as evaluation criterion.In&nbsp;[9]:     def rmse(y, y_pred):    &quot;&quot;&quot;RMSE for two vectors.&quot;&quot;&quot;    return np.sqrt(np.mean(np.square(y-y_pred)))     In&nbsp;[10]:     errors = pd.DataFrame(np.zeros(4).reshape((1, 4)), columns=[&#39;Mean&#39;, &#39;LR&#39;, &#39;rSVD&#39;, &#39;gSVD&#39;], index=[&#39;RMSE&#39;])     Grand mean&#182;In&nbsp;[11]:     error = np.zeros(5)for fold in range(1, 6):    train = pd.read_table(f&#39;ml-100k/u{fold}.base&#39;, header=None)    test = pd.read_table(f&#39;ml-100k/u{fold}.test&#39;, header=None)    X_train, y_train = train[[0, 1]].astype(&#39;category&#39;), train[[2]].to_numpy().astype(&#39;float&#39;)    X_test, y = test[[0, 1]].astype(&#39;category&#39;), test[[2]].to_numpy().astype(&#39;float&#39;)    y_pred = np.mean(y_train)    error[fold-1] = rmse(y, y_pred)errors[&#39;Mean&#39;] = error.mean()f&#39;RMSE for Grand Mean: {error.mean():.2f}&#39;             Out[11]:&#39;RMSE for Grand Mean: 1.13&#39;Linear regression&#182;In&nbsp;[12]:     from surprise import SVDfrom surprise import BaselineOnlyfrom surprise import Datasetfrom surprise import Readerfrom surprise import accuracyfrom surprise.model_selection import PredefinedKFoldfrom surprise.model_selection import cross_validate     In&nbsp;[13]:     # Alternatively, if data is not downloaded yet, use this command # data = Dataset.load_builtin(&#39;ml-100k&#39;)# If data is already downloaded with specific train-test split, can use codes below# path to dataset folderfiles_dir = os.path.join(os.getcwd(), &#39;ml-100k/&#39;)# This time, we&#39;ll use the built-in reader.reader = Reader(&#39;ml-100k&#39;)# folds_files is a list of tuples containing file paths:# [(u1.base, u1.test), (u2.base, u2.test), ... (u5.base, u5.test)]train_file = files_dir + &#39;u%d.base&#39;test_file = files_dir + &#39;u%d.test&#39;folds_files = [(train_file % i, test_file % i) for i in (1, 2, 3, 4, 5)]data = Dataset.load_from_folds(folds_files, reader=reader)pkf = PredefinedKFold()     In&nbsp;[15]:     algo = BaselineOnly()res = cross_validate(algo, data, measures=[&#39;RMSE&#39;], cv=pkf, verbose=True)errors[&#39;LR&#39;] = res[&#39;test_rmse&#39;].mean()f&#39;RMSE for Linear Regression: {errors[&quot;LR&quot;][0]:.2f}&#39;             Estimating biases using als...Estimating biases using als...Estimating biases using als...Estimating biases using als...Estimating biases using als...Evaluating RMSE of algorithm BaselineOnly on 5 split(s).                  Fold 1  Fold 2  Fold 3  Fold 4  Fold 5  Mean    Std     RMSE (testset)    0.9599  0.9477  0.9405  0.9383  0.9423  0.9457  0.0077  Fit time          0.04    0.07    0.06    0.07    0.06    0.06    0.01    Test time         0.04    0.08    0.04    0.04    0.07    0.05    0.02            Out[15]:&#39;RMSE for Linear Regression: 0.95&#39;SVD&#182;In&nbsp;[16]:     algo = SVD()res = cross_validate(algo, data, measures=[&#39;RMSE&#39;], cv=pkf, verbose=True)errors[&#39;rSVD&#39;] = res[&#39;test_rmse&#39;].mean()f&#39;RMSE for rSVD: {errors[&quot;rSVD&quot;][0]:.2f}&#39;             Evaluating RMSE of algorithm SVD on 5 split(s).                  Fold 1  Fold 2  Fold 3  Fold 4  Fold 5  Mean    Std     RMSE (testset)    0.9505  0.9389  0.9313  0.9301  0.9385  0.9379  0.0073  Fit time          2.21    2.24    2.22    2.23    2.24    2.23    0.01    Test time         0.07    0.07    0.10    0.07    0.11    0.08    0.02            Out[16]:&#39;RMSE for rSVD: 0.94&#39;Group SVD&#182;The MATLAB code is available https://sites.google.com/site/xuanbigts/software. I record the RMSE for different hyperparameter (each column) combinations below, and we use the second column at last.In&nbsp;[17]:     res = &#39;&#39;&#39;    0.9435    0.9210    0.9456    0.9287    0.9087    0.9329    0.9245    0.9077    0.9295    0.9309    0.9098    0.9316    0.9323    0.9170    0.9314&#39;&#39;&#39;res = np.fromstring(res, sep=&#39;\\t&#39;).reshape((5,3))[:,1].reshape(-1)errors[&#39;gSVD&#39;] = res.mean()f&#39;RMSE for gSVD: {errors[&quot;gSVD&quot;][0]:.2f}&#39;             Out[17]:&#39;RMSE for gSVD: 0.91&#39;Summary&#182;I tried grandient boosting as well, but the performance is as bad as grand mean, so I didn't put it here.In&nbsp;[18]:     errors             Out[18]:                  Mean      LR      rSVD      gSVD                  RMSE      1.125578      0.945736      0.937855      0.91284      In&nbsp;[19]:     sns.barplot(y=errors.values.reshape(-1), x=errors.columns)             Out[19]:&lt;AxesSubplot:&gt;        As we can see, gSVD utilize the non-ignorable missing pattern information and therefore performs better. The try on incorporate covariates fails, interested readers can try method 5 or 6, however I highly doubt that the improvement is neglectable. sSVD's source code is not published so I didn't realize it here, but it claims that incorporating network pattern in the user can further imporve the performance.Overall, recommender system is a super difficult topic, especially for large scale data with high missing rate. Simple method like linear regression is only slightly worse than rSVD. However, recent research shows that if we are able to utilize the pattern information in the data, it's promising to increase the accuracy.References&#182;A repo for examples and best practices for building recommendation systems, provided as Jupyter notebooks. Develpoed by Microsoft. https://github.com/microsoft/recommendersMazumder, Rahul, Trevor Hastie, and Robert Tibshirani. \"Spectral regularization algorithms for learning large incomplete matrices.\" The Journal of Machine Learning Research 11 (2010): 2287-2322.Funk, A. (2006). Netflix update: Try this at home. http://sifter.org/~simon/journal/20061211.htmlKoren, Y., Bell, R. and Volinsky, C. (2009). Matrix factorization techniques for recommender systems. IEEE, Computer, 8(42), 30–37.Agarwal, D. and Chen, B.-C. (2009), “Regression-Based Latent Factor Models,” in Proceedings of the 15th ACM SIGKDD International Conference on Knowledge Discovery and Data Mining, pp. 19–28.Zhu, Shen and Ye (2015). Personalized prediction and sparsity pursuit in latent factor models. JASA.Bi, X., Qu, A., Wang, J. and Shen, X. (2017). A group-specific recommender system. Journal of the American Statistical Association, 112, 1344-1353.",
        "url": "/stat/2021/03/25/Recommender-system-Movielens-100K-example.html"
      }

      "tools-2021-03-18-build-my-ubuntu-20-04-focal-html": {
        "title": "Build my Ubuntu 20.04 (focal)",
        "date": "March 18th, 2021",
        "excerpt": "This blog records how I install and configure my Ubuntu 20.04 . All the codes should be run in a terminal.",
        "author": "",
        "category": "",
        "content": "This blog records how I install and configure my Ubuntu 20.04 . All the codes should be run in a terminal.Contents  Hardware  Dual boot  Softwares/packages  Configure GNOME  Configure my Python environment          Intro      Install Python      Packages        OthersHardware  Model: AlienWare R11  CPU: Intel Core i7 10700kF  GPU: NVIDIA 3060Ti  Pre-installed system: Windows 10Dual bootThere are already lots of blogs on how to install Ubuntu and dual boot with Windows 10. For example,https://www.linuxtechi.com/dual-boot-ubuntu-20-04-lts-along-with-windows-10/One more thing on AlienWare, we have to change the SATA operation from RAID to AHCI. Then reboot the Windows with safe mode. The steps are      Run cmd as administrator (not PowerShell, you would have to escape {...})        Copy-paste this command, which will start Windows in Safe Mode the next time you reboot:    bcdedit /set {current} safeboot minimal            Restart the computer and enter UEFI/BIOS setup.        Change the SATA operation mode from RAID to AHCI.        Save changes and exit Setup and Windows will automatically boot to Safe Mode.        Launch cmd again, as in step #1.        Copy-paste this command, which will start Windows in Normal Mode the next time you reboot:    bcdedit /deletevalue {current} safeboot            Reboot and Windows will automatically start with AHCI drivers enabled.  Softwares/packagesUse the following command if installation failed due to dependencies are not installed.sudo apt -f install       Git: a tool for version control.    sudo apt install git-all            : a tool to download or transfer files/data from or to a server using FTP, HTTP, HTTPS, SCP, SFTP, SMB and other supported protocols on Linux or Unix-like system.    sudo apt install curl             Terminal multiplexer: byobu    sudo apt-get install byobu            bash: zsh and oh-my-zsh  for plugins/personalization. Powerful yet elegant.     sudo apt install zsh sh -c \"$(wget https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh -O -)\"        A lot of articles/configurations available online, e.g. Github.    My terminal appearance:            Web browser: Chrome. I’d suggest Chrome though Firefox is default in Ubuntu. The reason is that Chrome is supported by Google and has a larger community and tools, such as gmail, google drive.          Integral with Google Drive on Ubuntu 20.04                  Add online account to GNOME in the setting, but this way doesn’t work well if we have to interact frequently, like read and write file.          As an alternative, try google-drive-ocamlfuse. Installation and usage on the homepage are easy to follow.                    Chrome plugins                  Ad block, etc.          OneTab for tab management          Momentum for customized new tab          Tampermonkey for user script                           Markdown: Typora. Best markdown editor I’ve experienced. Support $\\LaTeX$ and exporting to PDF, html, tex, rST, word, etc.    # or run:# sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys BA300B7755AFCFAEwget -qO - https://typora.io/linux/public-key.asc | sudo apt-key add -# add Typora's repositorysudo add-apt-repository 'deb https://typora.io/linux ./'sudo apt-get update# install typorasudo apt-get install typora        If failed due to gpg: invalid key, remove the file in the “/etc/apt/trusted.gpg.d/home:manuelschneid3r.gpg”.        Text editor for general use: Sublime text 3.    wget -qO - https://download.sublimetext.com/sublimehq-pub.gpg | sudo apt-key add -sudo apt-get install apt-transport-httpssudo add-apt-repository \"deb https://download.sublimetext.com/ apt/stable/\"sudo apt-get updatesudo apt install sublime-text            IDE: Jetbrain toolbox and PyCharm. Best for Python and Java.        Desktop automation utility: AutoKey.    Install by package manager or pip.        Dictionary: GoldenDict. Support select words from screen. Support search from online source like WiKi and Google.    sudo apt-get install goldendict        Off-line dictionaries: StarDict        PDF reader: Okular. Support annotations like text, highlighter, hand-draw. Support multiple tabs. Support index and search.    Warning: Try to install from Ubuntu software store, current stable release(20.12.3) on kde channel has some bug.        Zoom    Problem: When use a high solution monitor, need to change the configuration file to match the font size. See here.  Configure GNOMEThis somehow quite personal. Anyhow if you want to do so, Tweak is the starting point, and Chrome-gnome plugin helps you manage the extensions.sudo apt install gnome-tweak-toolsudo apt install chrome-gnome-shellSome popular extensions  Dash to dock  Put windowsAlso, find themes here.Configure my Python environmentIntroI decide not to use Anaconda in this computer, since currently I use Python for research purpose and stick on a fairly stable version, say 3.8 or 3.9. I don’t need many different virtue environments and different versions of packages. Otherwise, it would be a good choice to manage the environments for beginners.Install Pythonsudo apt install python3.8PackagesNote that pip is not installed by default. So we have to install pip first.sudo apt install python3-pipThe binary file for pip is pip3, we can set an alias if we will not use Python 2.alias pip=pip3The following list is from most frequent/important for me to less frequent. Most of them can be installed bypip install package_name      jupyter Favorite tool for developing. A true notebook.                  Installation (for notebook only)        pip install notebook                            Extensions, almost necessary for me to use jupyter note book. Provide functions like notifying idle, highlighting, moving chunks, etc.        pip install jupyter-contrib-nbextensions                          Numpy, fundamental package for scientific computing.        Scipy, fundamental package for scientific computing.        pandas, data frame manipulation.        scikit-learn, machine learning algorithms.        pytorch, deep learning package developed by Facebook.    I installed the GPU version. For your CUDA and CUDNN version, try    nvidia-smi        Some how nvcc is not installed but nvidia driver and CUDA are already installed in my computer, so I didn’t bother install them this time.    For pytoch, please refer to its homepage.        matplotlib, visualization.        seaborn, for better visualization        Sphinx, for writing documentations. For usage see my another post here.        statsmodels, for statistical analysis.        thefuck, a command line tool.  Others      Font                  Install Font manager        sudo apt install font-manager                            My favorite font: Monaco. Used for Overleaf as well.  Download the font by:        wget http://www.gringod.com/wp-upload/software/Fonts/Monaco_Linux.ttf                          Wallpaper    Unfortunately, haven’t find a good solution for multiple monitors.        Albert    Doesn’t work very well with Google drive.  ",
        "url": "/tools/2021/03/18/Build-my-Ubuntu-20.04-(focal).html"
      }
      ,
    
    
    
      "tools-2021-03-06-how-to-publish-a-python-package-html": {
        "title": "How to publish a Python package",
        "date": "March 6th, 2021",
        "excerpt": "This blog records the way how I build and publish my first Python package, SubsetPrivacy (not released yet).",
        "author": "",
        "category": "",
        "content": "This blog records the way how I build and publish my first Python package, SubsetPrivacy (not released yet).My environments:  macOS Big Sur 11.0.1  Python 3.6  Sphinx 3.5.1Project structureA nice start point is this tutorial on how to packaging Python projects.It includes  The basic structure of an example project  How to configure metadata for the setup files (with templates)  Create README and LICENSE (See my previous blog for how to choose a license)Now you’ll have a project directory looks like thispackaging_tutorial├── LICENSE├── README.md├── example_pkg│   └── __init__.py├── pyproject.toml├── setup.cfg├── setup.py└── testsLet’s explore how to publish it before adding any code :)Following the instructions of the same tutorial, it tells  Generate distributions  Upload the package to Test PyPI and finally PyPI  Install the package we just uploadedCongratulations! You’ve published a new Python package! Now, let’s elaborate our project a little bit more.Organize the codeThe package I wrote is small — hence no need for sub-packages, I put all of my modules under the example_pkg directory. For example,example_pkg├── __init__.py├── foo.py└── bar.pyHere’s the documentation for __init__.py . In short, when example_pkg is imported, python will automatically execute  this file, which servers as the initialization of the whole project. We can import functions and classes defined in other modules in this file, such asfrom .foo import *from .bar import *Then we when have another python file andimport example_pkg, the functions in foo.py and bar.py are available.Remark 1: In the above, we use relative import from .foo import * since all the files are under the same directory. Absolute import will be from example_pkg.foo import *.Remark 2: Define __all__ variable in the foo.py will influence the behavior of from .foo import *, only items listed in the  __all__ will be imported. Also, if  __all__  is not specified, all variables start with _ or __ will not be imported.Remark 3: Test is important! Put the test codes in the parallel folder tests. Since I’m not familiar with that, the only recommendation is package unittest .Good, now it’s time to write the documentations!DocumentationsSphinx makes life easier! It’s the most famous and widely-used tool for documentation generation, specially designed for Python. The quick start given by the official website is somewhat hard for me to understand. After spending some time Googling, I construct my docs with the help of this tutorial.      Install Sphinx using pip install -U Sphinx    Create and initialize docs directory    $ cd packaging_tutorial$ mkdir docs$ cd docs$ sphinx-quickstart        I choose to use a directory “_build” within the root path (here the docs).        Now the docs directory looks like this    docs├── _static├── _templates├── _build├── conf.py├── index.rst├── Makefile└── make.bat        Build html documentations by    $ make html        and pdf by    $ make latexpdf      For conf.py, it controls the behavior of building process. Some extensions are almost necessary,      Append the root path and code path to the system path        Add extensions such as    extensions = [\"sphinx.ext.intersphinx\",\"sphinx.ext.autodoc\",  # auto generate docs for codes\"sphinx.ext.mathjax\",  # render latex\"sphinx.ext.napoleon\",  # for Numpy and Google style documentation\"nbsphinx\",  # enable including jupyter notebook]            I override the default theme by readthedocs theme (have to install the theme first through pip)    html_theme = \"sphinx_rtd_theme\"      Now, feel free to change index.rst and add more contents. The website is build based on reStructuredText. (Not easy to learn at all!) You can also add extensions like markdown and Jupyter notebook.Remark 4: I suppose you know how to add documentations for the code, otherwise, here are another two nice references on Numpy style guide and Google style guide.Host the docsRead the Docs is a free docs hosting for open source projects. It’s smooth to host the docs if we already build the docs using Sphinx and upload it to the Github. Otherwise, you may manually import the project following this guide.EndingHope it helps you figure out how to build and publish a new Python package. Feel free to reach out if you have any suggestions or questions.",
        "url": "/tools/2021/03/06/How-to-publish-a-Python-package.html"
      }

      "story-2020-08-08-expectation-for-lab-html": {
        "title": "Expectation for lab",
        "date": "August 8th, 2020",
        "excerpt": "As I recently reviewed my Spring 2020 Student Rating of Teaching (SRT) results, it inspired me to contemplate deeply on how I can better support and assist my students. This reflection is not just an evaluation of past teaching but also an open sharing of my thoughts and teaching philosophy.",
        "author": "",
        "category": "",
        "content": "As I recently reviewed my Spring 2020 Student Rating of Teaching (SRT) results, it inspired me to contemplate deeply on how I can better support and assist my students. This reflection is not just an evaluation of past teaching but also an open sharing of my thoughts and teaching philosophy.For undergrad coursesIn my initial year of teaching undergraduate classes, I encountered students with varying levels of familiarity with statistics and essential mathematics. Recognizing the diversity in their academic backgrounds, I realized the importance of adapting my teaching approach to accommodate everyone’s learning pace.Pace of LearningStudent feedback has highlighted diverse needs: some found the lab materials too similar to lectures and slow-paced, while others struggled to keep up.  Inspired by Prof. Bramson, I started seeking direct feedback from students on the class pace. This approach has generally been effective, showing that most undergraduates prefer a balanced pace.Regarding lab content, I generally agree with DGS that the goal is to supplement lecture material and ensure a understanding of elementary statistics, which is vital for future applications in various fields. For students who are more advanced, I encourage independent exploration, and I am always available to guide and answer questions.Lab MaterialsThe content of lab sessions is pre-determined and not within the TA’s control. I understand that preferences vary between theoretical and practical applications. If given the opportunity, I’d like to bridge the gap between abstract concepts and their applications, considering the diverse backgrounds of our students.Student InteractionEngaging effectively with students, particularly in theoretical aspects, has been a challenging yet enriching experience. I’ve had discussions with a number of educators on this matter and realize it’s a common challenge. I would greatly appreciate any suggestions on enhancing student engagement and interaction.For graduate coursesI haven’t taught any graduate class yet, but I am eagerly looking forward to it and plan to focus more on theoretical discussions.ConclusionsOur primary goal is to facilitate a deeper understanding of the course material, tailoring the speed and difficulty to the class’s needs. I believe in the fairness of a collective decision-making process, so I encourage you all to actively participate in giving feedback, whether through voting, emails, or other means. Your honest opinions are invaluable for improving the learning experience for everyone.Thank you for taking the time to read my reflections and thoughts. Your feedback and suggestions are not only welcomed but essential for my growth as an educator.Last edited: Nov. 16, 2023",
        "url": "/story/2020/08/08/Expectation-for-lab.html"
      }
      ,
    
    
    
      "story-2020-03-20-how-to-fit-an-elephant-html": {
        "title": "How to fit an elephant",
        "date": "March 20th, 2020",
        "excerpt": "Cited from John D. Cook",
        "author": "",
        "category": "",
        "content": "Cited from John D. Cook  John von Neumann famously said      With four parameters I can fit an elephant, and with five I can make him wiggle his trunk.    By this he meant that one should not be impressed when a complex model fits a data set well. With enough parameters, you can fit any data set.It turns out you can literally fit an elephant with four parameters if you allow the parameters to be complex numbers. See this paper for details: “Drawing an elephant with four complex parameters”1.  Piotr also sent me the following Python code he’d written to implement the method in the paper. This code produced the image above.Click to expand code.  \"\"\"Author: Piotr A. Zolnierczuk (zolnierczukp at ornl dot gov)Based on a paper by:Drawing an elephant with four complex parametersJurgen Mayer, Khaled Khairy, and Jonathon Howard,Am. J. Phys. 78, 648 (2010), DOI:10.1119/1.3254017\"\"\"import numpy as npimport pylab# elephant parametersp1, p2, p3, p4 = (50 - 30j, 18 +  8j, 12 - 10j, -14 - 60j )p5 = 40 + 20j # eyepiecedef fourier(t, C):    f = np.zeros(t.shape)    A, B = C.real, C.imag    for k in range(len(C)):        f = f + A[k]*np.cos(k*t) + B[k]*np.sin(k*t)    return fdef elephant(t, p1, p2, p3, p4, p5):    npar = 6    Cx = np.zeros((npar,), dtype='complex')    Cy = np.zeros((npar,), dtype='complex')    Cx[1] = p1.real*1j    Cx[2] = p2.real*1j    Cx[3] = p3.real    Cx[5] = p4.real        Cy[1] = p4.imag + p1.imag*1j    Cy[2] = p2.imag*1j    Cy[3] = p3.imag*1j        x = np.append(fourier(t,Cx), [-p5.imag])    y = np.append(fourier(t,Cy), [p5.imag])        return x,yx, y = elephant(np.linspace(0,2*np.pi,1000), p1, p2, p3, p4, p5)pylab.plot(y,-x,'.')pylab.show()  Some comments:  Actually the code above used five complex numbers, four for the contour and one for the eyepiece, thus ten parameters to fit the whole elephant.  We need one additional parameter to make its trunk wiggle, along with some code modification. Animation, Download code  Fourier strikes again!            Mayer, Jürgen, Khaled Khairy, and Jonathon Howard. “Drawing an elephant with four complex parameters.” American Journal of Physics 78.6 (2010): 648-649. &#8617;      ",
        "url": "/story/2020/03/20/How-to-fit-an-elephant.html"
      }
